services:
  db:
    image: mysql:8.0
    container_name: manzaneque_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: manzaneque_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

  server:
    build: ./server
    container_name: manzaneque_server
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides .env's DB_HOST/DB_PORT (which target the local-Node path,
      # see README) with the in-network service name/port for this container.
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./client
    container_name: manzaneque_web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  db_data:
