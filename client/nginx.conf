server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin /api so the client's relative fetch paths work
    # unchanged whether served by Vite dev (see vite.config.js) or here.
    location /api/ {
        proxy_pass http://server:4000/api/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
